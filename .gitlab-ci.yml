# Keep this version aligned with playwright in package-lock.json.
image: mcr.microsoft.com/playwright:v1.65.1-noble

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - build
  - test

default:
  cache: &npm_cache
    key:
      prefix: "playwright-noble-${CI_RUNNER_ID}"
      files:
        - package-lock.json
    paths:
      - .npm/
    # Only build uploads the cache; parallel test jobs just read it.
    policy: pull
  before_script:
    - npm ci --include=dev --cache .npm --prefer-offline --no-audit --no-fund
    # Existing test runners write diagnostics under os.tmpdir(). Keep their
    # output inside the checkout so GitLab can retain it on failure.
    - mkdir -p "$CI_PROJECT_DIR/.ci-artifacts"
    - export TMPDIR="$CI_PROJECT_DIR/.ci-artifacts"

build:
  stage: build
  cache:
    <<: *npm_cache
    policy: pull-push
  script:
    - npm run build
  artifacts:
    name: "dist-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 week

typecheck:
  stage: build
  script:
    - npm run check

label-glyphs:
  stage: build
  script:
    - node scripts/generate-label-glyphs.js --check

.browser-test:
  stage: test
  # Keep separately named jobs, but run only one browser suite at a time,
  # including across pipelines. Timing-sensitive assertions need an idle runner.
  resource_group: browser-tests
  # Every test consumes the same production build. Independent suites continue
  # even if another test job fails, rather than stopping at the first failure.
  needs:
    - job: build
      artifacts: true
  artifacts:
    name: "${CI_JOB_NAME_SLUG}-${CI_COMMIT_SHORT_SHA}"
    when: on_failure
    expire_in: 1 week
    paths:
      - .ci-artifacts/diagramtex-*/

functional:
  extends: .browser-test
  parallel:
    matrix:
      - BROWSER: [chromium, webkit, firefox]
  script:
    - node tests/run.mjs --dist --no-tex --${BROWSER}

# One named job per specialist suite. Each keeps its own browser matrix inside
# the runner, including comparisons that require multiple engines together.
browser-check:
  extends: .browser-test
  parallel:
    matrix:
      - SUITE:
          - rendering-parity
          - document-layout
          - webkit-rendering
          - mixed-labels
          - label-clipping
          - text-alignment
          - math-performance
          - label-display
          - document-performance
          - math-loading
          - math-priority
          - output-readiness
          - preview-fade
          - page-print
          - format-preview
          - construction-tools
          - modal-responsive
          - context-menu-layout
          - snapping-modes
  script:
    - node "tests/${SUITE}.mjs" --dist
