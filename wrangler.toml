# Cloudflare Workers deployment for DiagramTeX: a static-assets-only Worker (no server code).
# The build step compiles src/ (TypeScript + Svelte) into one minified bundle and copies ./public's assets
# into ./dist with the CSS joined and the service worker's precache generated; ./dist is what gets served.
# dist/_headers (written by the build) sets how long browsers keep each file.
# Deploy:  npm run deploy (wrangler deploy)        Local preview:  npx wrangler dev
# Preview: npx wrangler preview [--name <name>]   uploads a Preview (named after the git branch by default)
#          at its own workers.dev URL; production on the custom domain is not touched.
name = "diagramtex"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = true

# Runs before every `wrangler deploy`, `wrangler preview` and `wrangler dev` (and again on source/asset changes in dev):
# a clean install from package-lock.json (dev dependencies included: the compiler, svelte-check and wrangler are all
# devDependencies), then the strict typecheck (svelte-check), which must pass before anything is built.
[build]
command = "npm ci --include=dev --no-audit --no-fund --silent && npm run check && node scripts/build.js"
watch_dir = ["./src", "./public"]

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Settings for `wrangler preview`. The app has no bindings or variables, so there is nothing to override;
# wrangler requires the block to exist. Assets and compatibility settings come from the top level.
[previews]
