name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in the Playwright image. Keep its version aligned with
# playwright in package-lock.json (all five `image:` lines below).
# GitHub-hosted runners give every job its own fresh machine, so the browser
# suites run in parallel without competing for CPU (GitLab's single runner
# needed them one at a time).

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run check

  label-glyphs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/generate-label-glyphs.js --check

  # Every test uses the same production build. A failing suite doesn't stop the others.
  functional:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: node tests/run.mjs --dist --no-tex --${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-${{ matrix.browser }}
          path: .ci-artifacts/diagramtex-*/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # One job per specialist suite. Each runner keeps its own browser matrix,
  # including comparisons that need several engines together.
  browser-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        suite:
          - rendering-parity
          - document-layout
          - webkit-rendering
          - mixed-labels
          - label-clipping
          - text-alignment
          - math-performance
          - label-display
          - document-performance
          - math-loading
          - math-priority
          - output-readiness
          - preview-fade
          - label-swap
          - page-print
          - format-preview
          - construction-tools
          - modal-responsive
          - context-menu-layout
          - snapping-modes
          - palette-fit
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: node "tests/${{ matrix.suite }}.mjs" --dist
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-${{ matrix.suite }}
          path: .ci-artifacts/diagramtex-*/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # main → a Preview named "main" at its own workers.dev URL (production untouched),
  # once the build and the static checks pass. wrangler.toml's [build] command
  # reinstalls, typechecks and builds before uploading.
  preview:
    if: github.ref == 'refs/heads/main'
    needs: [build, typecheck, label-glyphs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-preview-main
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler preview --name main --message "${GITHUB_SHA::7}" | tee preview.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' preview.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # A vX.Y.Z tag → production, only after every check above passed on that
  # commit, then a GitHub Release for the tag with the release commit's title.
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, typecheck, label-glyphs, functional, browser-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: write
    environment:
      name: production
      url: https://diagramtex.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --tag "$GITHUB_REF_NAME" --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --format=%B HEAD)"
