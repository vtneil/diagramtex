name: CI

# Every branch, and release tags only (vX.Y.Z): other tags (the TeX bundle's tex-…) are releases of files, not of code.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Every job runs in the Playwright image. Keep its version aligned with
# playwright in package-lock.json (all five `image:` lines below).
# GitHub-hosted runners give every job its own fresh machine, so the browser
# suites run in parallel without competing for CPU (GitLab's single runner
# needed them one at a time).

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      # The in-browser LaTeX's TeX Live bundles stay out of the repository: the archive pinned in
      # scripts/tex-bundle.lock.json comes from its GitHub release (checked against the lock's SHA-256)
      # and goes into dist/ with the rest, so the Preview and production serve it themselves.
      - name: Restore the TeX Live bundle archive
        uses: actions/cache@v6
        with:
          path: .tex-bundle
          key: tex-bundle-${{ hashFiles('scripts/tex-bundle.lock.json') }}
      - run: node scripts/tex-bundle-fetch.mjs
      # Only a vX.Y.Z tag builds as its release number. Every other build (the main Preview among them)
      # is versioned by its commit: the short hash replaces TD.VERSION in this checkout only, so the app's
      # footer, version.json and exports name the commit. The repository keeps the release number.
      - name: Version a non-release build by its commit
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          sed -i -E "s/(TD\.VERSION = ')[^']+'/\1${GITHUB_SHA::7}'/" src/domain/shapes.ts
          grep -q "TD.VERSION = '${GITHUB_SHA::7}'" src/domain/shapes.ts
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check

  label-glyphs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/generate-label-glyphs.js --check
      - run: node scripts/patch-katex.js --check

  # A release tag's commit was pushed to main with it (/release) and is tested there: the tag's run waits for that
  # run and takes its result instead of testing the same code again. Its own build still runs (it's versioned by the
  # release number, main's by the commit, and nothing else differs), and so do typecheck and label-glyphs, which are
  # quick. When main failed, so does this, and nothing deploys; when main never had the commit (a tag pushed on its
  # own), passed is false and the tag's run tests everything itself.
  tested-on-main:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.main.outputs.passed }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "" else "\(.id) \(.status) \(.conclusion // "")" end')
            if [ -z "$run" ]; then echo "main has no run of $GITHUB_SHA: testing it here"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            read -r id state result <<< "$run"
            if [ "$state" = completed ]; then
              if [ "$result" = success ]; then echo "main's run $id passed: its tests stand for this tag"; echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "::error::main's run $id of this commit ended $result: no release from it"; exit 1
            fi
            echo "waiting for main's run $id ($state)"; sleep 30
          done

  # Every test uses the same production build. A failing suite doesn't stop the others. (Not in a release tag's run
  # whose commit passed on main: tested-on-main.)
  functional:
    needs: [build, tested-on-main]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tested-on-main.result != 'failure' && needs.tested-on-main.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: node tests/run.mjs --dist --no-tex --${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-${{ matrix.browser }}
          path: .ci-artifacts/diagramtex-*/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # One job per specialist suite. Each runner keeps its own browser matrix,
  # including comparisons that need several engines together.
  browser-check:
    needs: [build, tested-on-main]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tested-on-main.result != 'failure' && needs.tested-on-main.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        suite:
          - rendering-parity
          - document-layout
          - webkit-rendering
          - mixed-labels
          - label-clipping
          - text-alignment
          - math-performance
          - label-display
          - document-performance
          - math-loading
          - math-priority
          - output-readiness
          - preview-fade
          - label-swap
          - page-print
          - format-preview
          - construction-tools
          - modal-responsive
          - context-menu-layout
          - snapping-modes
          - palette-fit
          - package-pages
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: node "tests/${{ matrix.suite }}.mjs" --dist
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-${{ matrix.suite }}
          path: .ci-artifacts/diagramtex-*/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # main → a Preview named "main" at its own workers.dev URL (production untouched),
  # once the build and the static checks pass.
  #
  # The Cloudflare token is only in the final wrangler step. That step uploads the
  # build job's dist/ with wrangler.ci.toml (no [build] table), so the only code
  # running with the token is wrangler itself, at the version in package-lock.json,
  # installed without install scripts (.github/actions/cloudflare-prep).
  preview:
    if: github.ref == 'refs/heads/main'
    needs: [build, typecheck, label-glyphs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-preview-main
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-prep
      - id: preview
        name: Upload the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node_modules/.bin/wrangler preview -c wrangler.ci.toml --name main --message "${GITHUB_SHA::7}" | tee preview.log
          # Prefer the Preview's stable address (main-…) over this upload's own one.
          urls=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' preview.log || true)
          url=$(printf '%s\n' "$urls" | grep -m1 '^https://main-' || printf '%s\n' "$urls" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # A vX.Y.Z tag → production, only after every check above passed on that
  # commit (the tests here, or main's run of it: tested-on-main), then a GitHub
  # Release for the tag with the release commit's title.
  # The token is handled as in preview: only the wrangler step has it.
  deploy:
    needs: [build, typecheck, label-glyphs, tested-on-main, functional, browser-check]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' && needs.typecheck.result == 'success' && needs.label-glyphs.result == 'success'
      && needs.tested-on-main.result == 'success'
      && (needs.tested-on-main.outputs.passed == 'true' || (needs.functional.result == 'success' && needs.browser-check.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: write
    environment:
      name: production
      url: https://diagramtex.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-prep
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node_modules/.bin/wrangler deploy -c wrangler.ci.toml --tag "$GITHUB_REF_NAME" --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --format=%B HEAD)"
